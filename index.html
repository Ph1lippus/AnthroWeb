<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/AnthroWeb.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AnthroWeb</title>
    <meta name="description" content="A comprehensive daily tracking application for health, habits, goals, and more." />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The app root stays out of layout until these faces have settled, so
         loading the display font cannot move already-visible text. The boot
         background remains stable while its logo waits for Rubik Glitch. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=VT323&display=block"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&display=block"
    />
    <style>
      .boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #000;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace !important;
        font-size: 16px;
        font-weight: 400;
        line-height: 1;
        color: #fffbfb;
        isolation: isolate;
      }
      .boot__inner {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 220px;
        height: 76px;
        transform: translate(-50%, -50%);
        text-align: center;
        visibility: hidden;
      }
      .boot.boot-font-ready .boot__inner {
        visibility: visible;
      }
      .boot__word {
        display: block;
        width: 220px;
        height: 24px;
        margin: 0;
        padding: 0;
        font-family: 'Rubik Glitch', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace !important;
        font-size: 1.5rem;
        font-weight: 400;
        line-height: 24px;
        letter-spacing: 0.18em;
        text-indent: 0.18em;
        color: #ffffff;
      }

      .boot__rule {
        display: block;
        width: 180px;
        height: 2px;
        margin: 10px auto 0;
        padding: 0;
        border: 0;
        border-radius: 2px;
        background: rgba(0, 255, 166, 0.15);
        overflow: hidden;
        position: relative;
      }
      .boot__rule::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(
          to right,
          rgba(0, 255, 166, 0) 0%,
          rgba(0, 255, 166, 0.9) 50%,
          rgba(0, 255, 166, 0) 100%
        );
        transform-origin: left center;
        /* A fill that eases across and holds at full: reaching the right edge
           is the moment the handoff reveals the page, so the bar parks at 100%
           instead of looping. Slow enough to be seen on a fast load, quick
           enough never to be the thing holding the reveal. */
        animation: boot-fill 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @keyframes boot-fill {
        0% { transform: scaleX(0); opacity: 0; }
        15% { opacity: 1; }
        70% { transform: scaleX(0.85); opacity: 1; }
        100% { transform: scaleX(1); opacity: 1; }
      }
      .boot__status {
        display: block;
        width: 220px;
        height: 14px;
        margin: 10px 0 0;
        padding: 0;
        font-size: 0.68rem;
        font-weight: 400;
        line-height: 14px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #fffbfb;
        opacity: 0.4;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace !important;
      }
      /* React mounts while booting, but must not participate in the initial
         document paint. Otherwise the static splash and the first app render
         appear together and the later font/layout pass is visible. */
      #root:not(.boot-ready) {
        display: none !important;
      }
      #root.boot-ready {
        display: flex !important;
      }
    </style>
  </head>
  <body>
    <div id="boot" class="boot" role="status" aria-live="polite">
      <div class="boot__inner">
        <h1 class="boot__word">ANTHROWEB</h1>
        <hr class="boot__rule" />
        <p class="boot__status">Starting up</p>
      </div>
    </div>
    <script>
      /* Keep the background visible immediately, but do not show any fallback
         boot text. Both faces are part of the same reveal so the logo and status
         cannot remeasure independently. */
      (function () {
        var boot = document.getElementById('boot');
        if (!boot || !document.fonts || !document.fonts.load) return;
        Promise.all([
          document.fonts.load('400 24px "Rubik Glitch"'),
          document.fonts.load('400 16px "JetBrains Mono"')
        ]).then(function () {
          boot.classList.add('boot-font-ready');
        });
      })();
    </script>
    <div id="root"></div>
    <script>
      /* Guests skip the splash entirely: without a stored Supabase session there
         is nothing to wait for, so the static boot markup goes before React
         mounts and the app root is revealed immediately. Signed-in users keep
         the splash; the React handoff takes it down once the app is ready.
         Storage access can throw (blocked cookies) -- then the splash stays
         for the React backup in BootHandoff to handle. */
      (function () {
        try {
          var hasSession = false;
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.lastIndexOf('sb-', 0) === 0 && k.indexOf('-auth-token') !== -1) {
              var v = localStorage.getItem(k);
              if (v && v !== 'null' && v !== '[]' && v !== '{}') { hasSession = true; break; }
            }
          }
          if (!hasSession) {
            var boot = document.getElementById('boot');
            var root = document.getElementById('root');
            if (root) root.classList.add('boot-ready');
            if (boot) boot.remove();
          }
        } catch (e) { /* leave the splash for React to handle */ }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      (function () {
        var HOLD_MS = 1200;
        window.setTimeout(function () {
          var boot = document.getElementById('boot');
          if (!boot || boot.dataset.dismissing === 'true') return;
          boot.dataset.dismissing = 'true';
          var status = boot.querySelector('.boot__status');
          if (status) status.textContent = 'Reload to continue';
          window.setTimeout(function () {
            var root = document.getElementById('root');
            if (root) root.classList.add('boot-ready');
            boot.remove();
          }, HOLD_MS);
        }, 15000);
      })();
    </script>
  </body>
</html>
