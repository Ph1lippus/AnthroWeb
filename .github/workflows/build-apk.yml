name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.1.0). Leave blank to auto-bump from the latest release.'
        required: false
        type: string

permissions:
  contents: write

# One release at a time. Two pushes landing together would otherwise both read
# the same "latest" version, both bump to the same next patch, and one would lose
# the push. `cancel-in-progress: false` because cancelling a build halfway
# through an APK upload is worse than waiting for it.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      # The web bundle is built here and shipped inside the APK, so the runner
      # needs the same two values Vercel has. Vite inlines `import.meta.env.VITE_*`
      # textually at build time -- a variable that is absent does not warn and does
      # not fail, it becomes the literal `undefined` inside the bundle, and the
      # installed app then throws "Missing Supabase environment variables" on
      # launch. The build stayed green that way, which is why `vite.config.ts`
      # now refuses to build for production without them.
      #
      # `vars.* || secrets.*` on purpose: GitHub splits these across two tabs and
      # only one of them is correct for a value that is not a secret. Accepting
      # either means the answer to "which tab" does not matter, which is the right
      # call for a publishable key that only exists to be published.
      #
      # VITE_SUPABASE_SERVICE_ROLE_KEY must never be added here. Anything with a
      # VITE_ prefix is inlined into the client bundle, and that one is a full
      # bypass of row level security.
      - name: Check build variables are present
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Written as `if` blocks rather than `[ -z "$X" ] && MISSING="..."`.
          # GitHub runs this with `bash -e`, and a `&&` chain whose test fails
          # leaves the list returning non-zero -- which is exempt from `-e` only
          # by a subtle rule. `if` makes it obvious, and this cannot be run
          # locally to find out.
          MISSING=""
          if [ -z "$VITE_SUPABASE_URL" ]; then
            MISSING="$MISSING VITE_SUPABASE_URL"
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            MISSING="$MISSING VITE_SUPABASE_ANON_KEY"
          fi
          if [ -n "$MISSING" ]; then
            echo "::error::Missing$MISSING"
            echo ""
            echo "The APK bundles the web build, so this runner needs the same two"
            echo "values Vercel has. Add them at:"
            echo ""
            echo "  Repo -> Settings -> Secrets and variables -> Actions"
            echo "    -> the 'Variables' tab (or 'Secrets'; both are read)"
            echo ""
            echo "  VITE_SUPABASE_URL      https://<ref>.supabase.co"
            echo "  VITE_SUPABASE_ANON_KEY sb_publishable_..."
            echo ""
            echo "Values are in Supabase -> Project Settings -> API."
            echo "These are publishable and are inlined into the bundle by design."
            exit 1
          fi
          echo "Both build variables are present."

      - name: Build web assets
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      # Decode the base64 keystore if provided (production signing)
      - name: Decode signing key
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore.jks

      # Without keystore secrets, sign with the committed debug keystore so
      # every release APK uses the SAME key. A per-build random key would make
      # Android refuse updates ("package conflicts with an existing package").
      - name: Use fixed debug signing key
        if: env.KEYSTORE_BASE64 == ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "DEBUG_KEYSTORE=$GITHUB_WORKSPACE/android/debug.keystore" >> "$GITHUB_ENV"

      # Determine the version for the release: manual input, else auto-bump the
      # patch above every version that already exists.
      #
      # The base comes from both releases and remote tags, because a run can leave
      # a tag without a release (or a release without a local tag): a `git tag`
      # lookup alone sees only the tags this checkout fetched, which is why v1.0.71
      # was bumped away from and then pushed into an already-existing tag. The
      # remote is the authority, and `sort -V` is what orders 1.0.10 after 1.0.9
      # correctly.
      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            RELEASES=$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,isDraft \
              --jq '.[] | select(.isDraft == false) | .tagName' || true)
            TAGS=$(git ls-remote --tags --refs origin 'v*' | awk '{print $2}' | sed 's#refs/tags/##' || true)
            LATEST=$(printf '%s\n%s\n' "$RELEASES" "$TAGS" \
              | sed 's/^v//' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1 || true)
            if [ -z "$LATEST" ]; then
              VERSION="1.0.0"
            else
              IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
              PATCH=$(( ${PATCH:-0} + 1 ))
              VERSION="$MAJOR.$MINOR.${PATCH}"
            fi
            echo "Auto-bumped version to $VERSION (from ${LATEST:-no previous version})"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          APP_VERSION: ${{ env.VERSION }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DEBUG_KEYSTORE: ${{ env.DEBUG_KEYSTORE }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anthroweb-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Create git tag
        if: env.VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Ask the remote, not the checkout. `actions/checkout` does not fetch
          # every tag, so `git rev-parse` here can confidently say a tag does not
          # exist and then have the push rejected.
          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q .; then
            echo "Tag v${VERSION} already exists on origin, skipping."
          else
            git tag "v${VERSION}" "$GITHUB_SHA"
            git push origin "v${VERSION}"
          fi

      - name: Create GitHub Release
        if: env.VERSION != ''
        env:
          VERSION: ${{ env.VERSION }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists, skipping."
          else
            gh release create "v${VERSION}" \
              android/app/build/outputs/apk/release/*.apk \
              --repo "${{ github.repository }}" \
              --title "AnthroWeb v${VERSION}" \
              --notes "Auto-generated release for AnthroWeb Android app."
          fi