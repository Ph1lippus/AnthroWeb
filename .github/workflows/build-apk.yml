name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.1.0). Leave blank to auto-bump from the latest release.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      # Decode the base64 keystore if provided (production signing)
      - name: Decode signing key
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore.jks

      # Without keystore secrets, sign with the committed debug keystore so
      # every release APK uses the SAME key. A per-build random key would make
      # Android refuse updates ("package conflicts with an existing package").
      - name: Use fixed debug signing key
        if: env.KEYSTORE_BASE64 == ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "DEBUG_KEYSTORE=$GITHUB_WORKSPACE/android/debug.keystore" >> "$GITHUB_ENV"

      # Determine the version for the release: manual input, else auto-bump the
      # patch from the latest existing release (or 1.0.0 if none).
      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            LATEST=$(gh release list --repo "${{ github.repository }}" --limit 5 --json tagName,isDraft --jq '.[] | select(.isDraft == false) | .tagName' | head -n 1)
            if [ -z "$LATEST" ]; then
              VERSION="1.0.0"
            else
              BASE="${LATEST#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
              PATCH=$(( ${PATCH:-0} + 1 ))
              VERSION="$MAJOR.$MINOR.$PATCH"
            fi
            echo "Auto-bumped version to $VERSION"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          APP_VERSION: ${{ env.VERSION }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DEBUG_KEYSTORE: ${{ env.DEBUG_KEYSTORE }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anthroweb-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Create git tag
        if: env.VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists, skipping."
          else
            git tag "v${VERSION}" "$GITHUB_SHA"
            git push origin "v${VERSION}"
          fi

      - name: Create GitHub Release
        if: env.VERSION != ''
        env:
          VERSION: ${{ env.VERSION }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists, skipping."
          else
            gh release create "v${VERSION}" \
              android/app/build/outputs/apk/release/*.apk \
              --repo "${{ github.repository }}" \
              --title "AnthroWeb v${VERSION}" \
              --notes "Auto-generated release for AnthroWeb Android app."
          fi