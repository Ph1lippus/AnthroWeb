[package]
name = "anthroweb"
version = "0.0.0"
description = "AnthroWeb Desktop App"
edition = "2021"

[lib]
name = "anthroweb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.0.0"

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
